; HyperK Turbo build profile for HyperHDR-driven realtime UDP use.
; Tracked in this fork even though .gitignore excludes platformio_override.ini
; (WLED upstream treats it as a per-developer file). See plan
; docs/superpowers/plans/2026-05-03-wled-hyperk-turbo.md.

[platformio]
default_envs =
    hyperk_turbo_esp32
    hyperk_turbo_esp32c3

[env:hyperk_turbo_esp32]
extends = env:esp32dev
; WLED_RELEASE_NAME matches stock WLED (env:esp32dev) so OTA from stock builds
; doesn't trigger the release-compatibility check in wled_metadata.cpp:155.
; The HYPERK turbo identity is carried by WLED_HYPERK_TURBO; release name
; remains "ESP32" to keep OTA reciprocal with stock images.
build_flags = ${env:esp32dev.build_flags}
  -D WLED_HYPERK_TURBO=1
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_2D
  -D WLED_DISABLE_PIXELFORGE
  -D WLED_DISABLE_PARTICLESYSTEM2D
  -D WLED_DISABLE_PARTICLESYSTEM1D
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_WEBSOCKETS
custom_usermods =

[env:hyperk_turbo_esp32_probe]
extends = env:hyperk_turbo_esp32
build_flags = ${env:hyperk_turbo_esp32.build_flags}
  -D BENCH_PROBE=1

[env:hyperk_turbo_esp32c3]
extends = env:esp32c3dev
; WLED_RELEASE_NAME matches stock WLED (env:esp32c3dev) so OTA-from-stock works
; without skipValidation. See note in env:hyperk_turbo_esp32 above.
build_flags = ${env:esp32c3dev.build_flags}
  -D WLED_HYPERK_TURBO=1
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_2D
  -D WLED_DISABLE_PIXELFORGE
  -D WLED_DISABLE_PARTICLESYSTEM2D
  -D WLED_DISABLE_PARTICLESYSTEM1D
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_WEBSOCKETS
custom_usermods =

[env:hyperk_turbo_esp32c3_probe]
extends = env:hyperk_turbo_esp32c3
build_flags = ${env:hyperk_turbo_esp32c3.build_flags}
  -D BENCH_PROBE=1
