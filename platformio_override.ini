; HyperK Turbo build profile for HyperHDR-driven realtime UDP use.
; Tracked in this fork even though .gitignore excludes platformio_override.ini
; (WLED upstream treats it as a per-developer file). See plan
; docs/superpowers/plans/2026-05-03-wled-hyperk-turbo.md.

[platformio]
default_envs = hyperk_turbo_esp32

[env:hyperk_turbo_esp32]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}
  -D WLED_RELEASE_NAME=\"HYPERK_TURBO_ESP32\"
  -D WLED_HYPERK_TURBO=1
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_2D
  -D WLED_DISABLE_PIXELFORGE
  -D WLED_DISABLE_PARTICLESYSTEM2D
  -D WLED_DISABLE_PARTICLESYSTEM1D
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_WEBSOCKETS
custom_usermods =

[env:hyperk_turbo_esp32_probe]
extends = env:hyperk_turbo_esp32
build_flags = ${env:hyperk_turbo_esp32.build_flags}
  -D BENCH_PROBE=1
